name: Build, Push & Deploy to VPS

on:
  workflow_dispatch:

concurrency:
  group: face-recognition-api
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/face-recognition-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU not needed since we're only building amd64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  deploy-to-vps:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to GoDaddy VPS via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script_stop: true
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,REGISTRY,IMAGE_NAME
          script: |
            set -eo pipefail

            IMAGE="${REGISTRY}/${IMAGE_NAME}:latest"
            CONTAINER_NAME="face-recognition-api"
            APP_DIR="$HOME/face-recognition-model"
            ENV_FILE="$APP_DIR/app.env"

            # ---- Preflight: host files the container depends on ----
            for p in "$ENV_FILE" "$APP_DIR/firebase_service.json" \
                     "$APP_DIR/models/scrfd_2.5g_bnkps.onnx" \
                     "$APP_DIR/models/w600k_mbf.onnx" "$APP_DIR/data"; do
              if [ ! -e "$p" ]; then
                echo "ERROR: missing $p on VPS - aborting, existing container left running."
                exit 1
              fi
            done

            echo "Logging in to Docker Hub on VPS..."
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            echo "Pulling image: ${IMAGE}"
            docker pull "${IMAGE}"

            echo "Stopping/removing existing container if present..."
            if [ "$(docker ps -aq -f name="^${CONTAINER_NAME}$")" ]; then
              docker rm -f "${CONTAINER_NAME}" || true
            fi

            echo "Starting new container..."
            docker run -d \
              --name "${CONTAINER_NAME}" \
              --restart unless-stopped \
              -p 6900:6900 \
              --env-file "$ENV_FILE" \
              -v "$APP_DIR/data:/code/data" \
              -v "$APP_DIR/models:/code/models:ro" \
              -v "$APP_DIR/firebase_service.json:/code/firebase_service.json:ro" \
              "${IMAGE}"

            echo "Waiting for /healthz..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:6900/healthz >/dev/null 2>&1; then
                echo "Healthy."
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: service not healthy after 60s. Recent logs:"
                docker logs --tail 50 "${CONTAINER_NAME}"
                exit 1
              fi
              sleep 2
            done

            # Only remove dangling images - never volumes (other apps share this VPS)
            docker image prune -f || true

            echo "Deployment complete. Current status:"
            docker ps --filter "name=${CONTAINER_NAME}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REGISTRY: docker.io
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/face-recognition-api
